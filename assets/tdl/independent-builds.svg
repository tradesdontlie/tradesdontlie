<svg xmlns="http://www.w3.org/2000/svg" width="960" height="704" viewBox="0 0 960 704" role="img" aria-labelledby="title desc"><title id="title">Independent builds</title><desc id="desc">Three private projects: a charting workbench in Rust, Python, and TypeScript; a business operating platform in Python and TypeScript; and a custom C++ and SDL3 game engine. The first two are in development; the engine is pre-alpha.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151515"/><stop offset=".45" stop-color="#08090a"/><stop offset="1" stop-color="#181818"/></linearGradient><radialGradient id="light"><stop stop-color="#FFD700" stop-opacity=".04"/><stop offset="1" stop-color="#FFD700" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFD700" stroke-opacity=".025"/></pattern><clipPath id="frame"><rect x="1" y="1" width="958" height="702" rx="14"/></clipPath></defs><g clip-path="url(#frame)"><rect width="960" height="704" fill="url(#bg)"/><rect width="960" height="704" fill="url(#grid)"/><ellipse cx="950" cy="350" rx="360" ry="540" fill="url(#light)"/><rect width="4" height="704" fill="#FFD700"/>
<text x="42" y="39" font-family="Consolas,monospace" font-size="12" letter-spacing="2.5" fill="#FFD700">INDEPENDENT BUILDS / PRIVATE SOURCE</text>
<text x="42" y="86" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#fff">From the workspace to the engine.</text>
<g transform="translate(42,120)"><path d="M0 0H876" stroke="#666666" stroke-opacity=".5"/><text x="0" y="40" font-family="Consolas,monospace" font-size="13" fill="#FFD700">01</text><text x="36" y="41" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#fff">Charting workbench</text><text x="36" y="77" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#e1e0d4">A workspace built around market analysis.</text><text x="36" y="106" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#bdbfad">Charts, studies, drawing tools, and live data.</text><text x="36" y="148" font-family="Consolas,monospace" font-size="12" letter-spacing="1" fill="#FFD700">RUST / PYTHON / TYPESCRIPT</text><g transform="translate(714,28)" fill="none" stroke="#FFD700" stroke-width="1.8" opacity=".45"><path d="M0 85H130M0 0V85M8 66L30 47 49 56 76 24 98 37 127 6"/><path d="M26 12V38M52 3V28M78 47V74M104 52V82" opacity=".35"/></g><text x="864" y="153" text-anchor="end" font-family="Consolas,monospace" font-size="11" letter-spacing="1" fill="#c7c098">IN DEVELOPMENT</text></g><g transform="translate(42,304)"><path d="M0 0H876" stroke="#666666" stroke-opacity=".5"/><text x="0" y="40" font-family="Consolas,monospace" font-size="13" fill="#FFD700">02</text><text x="36" y="41" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#fff">Business operating platform</text><text x="36" y="77" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#e1e0d4">From the first lead to customer delivery.</text><text x="36" y="106" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#bdbfad">Sales, communications, and service operations.</text><text x="36" y="148" font-family="Consolas,monospace" font-size="12" letter-spacing="1" fill="#FFD700">PYTHON / TYPESCRIPT</text><g transform="translate(714,28)" fill="none" stroke="#FFD700" stroke-width="1.8" opacity=".45"><rect x="0" y="25" width="34" height="35" rx="4"/><rect x="94" y="0" width="34" height="30" rx="4"/><rect x="94" y="57" width="34" height="30" rx="4"/><path d="M34 42H66V15H94M66 42V72H94"/></g><text x="864" y="153" text-anchor="end" font-family="Consolas,monospace" font-size="11" letter-spacing="1" fill="#c7c098">IN DEVELOPMENT</text></g><g transform="translate(42,488)"><path d="M0 0H876" stroke="#666666" stroke-opacity=".5"/><text x="0" y="40" font-family="Consolas,monospace" font-size="13" fill="#FFD700">03</text><text x="36" y="41" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#fff">Custom game engine</text><text x="36" y="77" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#e1e0d4">An action RPG, built from the engine up.</text><text x="36" y="106" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#bdbfad">2D rendering, gameplay, and live editing tools.</text><text x="36" y="148" font-family="Consolas,monospace" font-size="12" letter-spacing="1" fill="#FFD700">C++ / SDL3</text><g transform="translate(714,28)" fill="none" stroke="#FFD700" stroke-width="1.8" opacity=".45"><path d="M65 0L125 30V85L65 115 5 85V30ZM5 30L65 60 125 30M65 60V115M65 0V60"/><path d="M35 15L95 45V100M5 58L65 88 125 58" opacity=".35"/></g><text x="864" y="153" text-anchor="end" font-family="Consolas,monospace" font-size="11" letter-spacing="1" fill="#c7c098">PRE-ALPHA</text></g><path d="M932 704L960 676V704Z" fill="#FFD700"/></g><rect x="1" y="1" width="958" height="702" rx="14" fill="none" stroke="#3c3c3c"/></svg>